[project]
name = "veil"
version = "0.1.0"
description = "Stealth browser sessions for AI agents: Fortress engine + browser-use + rotating, geo-coherent identities"
readme = "README.md"
authors = [
    { name = "Saurabh Bansal", email = "bsaurabh719+github@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "browser-use>=0.13.10",
    "httpx>=0.28.1",
    "python-dotenv>=1.2.2",
    "tilion-fortress>=151.0.7908.0.post5",
]

[project.scripts]
veil = "veil:main"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
